<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=/ko/" />
    <link rel="canonical" href="https://smbest.kr/ko/" />
    <title>SMBEST</title>
    <script>
      // Preserve any query/hash while sending visitors to the default locale.
      var target = "/ko/" + window.location.search + window.location.hash;
      window.location.replace(target);
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, "Apple SD Gothic Neo", sans-serif;
        background: hsl(48 33% 97%);
        color: hsl(150 18% 12%);
      }
      a {
        color: hsl(151 43% 24%);
      }
    </style>
  </head>
  <body>
    <!-- Shown only if the browser has JavaScript disabled and ignores the meta refresh. -->
    <p>
      SMBEST 페이지로 이동합니다.
      <a href="/ko/">이동하지 않으면 여기를 눌러주세요.</a>
    </p>
  </body>
</html>
